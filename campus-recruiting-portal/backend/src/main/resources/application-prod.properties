# Production Database Configuration (TiDB Cloud)
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/CRM?sslMode=VERIFY_IDENTITY&useSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:test.root}
spring.datasource.password=${DB_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP Connection Pool - Tuned for Render 512MB RAM & TiDB Cloud
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=TiDBHikariPool

# Embedded Tomcat Threads - Tuned to reduce idle memory overhead on Render
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# CORS Allowed Origins (Comma-separated from env)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}